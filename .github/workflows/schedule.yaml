name: scheduled

on:
  repository_dispatch: {}
  workflow_dispatch: {}
  schedule:
    - cron: "00 15 * * *"

permissions:
  contents: read

jobs:
  schedule:
    uses: miracum/.github/.github/workflows/standard-schedule.yaml@217f0425b4039ca66596aeb30b6461e2511a0e09 # v1.30.1
    permissions:
      contents: read
      issues: write
      security-events: write
