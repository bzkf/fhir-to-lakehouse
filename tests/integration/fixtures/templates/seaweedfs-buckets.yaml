apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seaweedfs-buckets
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["/bin/sh", "-ec"]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-seaweedfs-s3-secret
                  key: admin_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-seaweedfs-s3-secret
                  key: admin_secret_access_key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          args:
            - |
              endpoint=http://{{ .Release.Name }}-seaweedfs-all-in-one:8333

              until aws --endpoint-url "$endpoint" s3api list-buckets; do
                sleep 5
              done

              for bucket in fhir spark-streaming-checkpoints; do
                aws --endpoint-url "$endpoint" s3api head-bucket --bucket "$bucket" ||
                aws --endpoint-url "$endpoint" s3api create-bucket --bucket "$bucket"
              done