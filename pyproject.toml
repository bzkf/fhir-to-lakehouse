[project]
name = "fhir-to-lakehouse"
version = "1"
description = "Reads FHIR bundles from Kafka, encodes them using the Pathling encoders, and stores them as Delta Lake tables."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pathling==9.9.0",
    "delta-spark==4.4.1",
    "typed-settings[attrs]==25.3.0",
    "loguru==0.7.3",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-prometheus==0.66b1",
    "tenacity==9.2.1",
    "tomli==2.5.0",
    "click==8.5.0",
    "deltalake==1.6.6",
    "boto3==1.43.112",
]

[dependency-groups]
dev = [
    "kafka-python==2.3.2",
    "pandas==3.0.6",
    # required by deltalake's to_pandas() in the integration tests
    "pyarrow==23.0.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "testcontainers[minio]==4.15.0",
    "ruff==0.17.0",
    "pyrefly==1.3.2",
]

[tool.uv]
# ipython is only used by pathling's interactive console, which isn't used here.
# The never-matching marker keeps it (and jedi, pygments, ...) out of the environment.
override-dependencies = ["ipython; sys_platform == 'never'"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pyrefly]
preset = "default"
project-includes = ["src", "tests"]
